name: Playground

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'balkh/**'
      - 'examples/**'
      - 'editors/vscode/syntaxes/**'
      - 'editors/vscode/language-configuration.json'
      - 'editors/vscode/src/tokens.cjs'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/playground.yml'
  pull_request:
    paths:
      - 'playground/**'
      - 'balkh/**'
      - 'examples/**'
      - 'editors/vscode/syntaxes/**'
      - 'editors/vscode/language-configuration.json'
      - 'editors/vscode/src/tokens.cjs'
      - 'tests/**'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.github/workflows/playground.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playground-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: playground/package-lock.json
      - name: Test interpreter and playground runner
        run: |
          python -m pip install -e '.[test]'
          python -m pytest
      - name: Install playground tooling
        working-directory: playground
        run: npm ci --ignore-scripts
      - name: Build playground
        working-directory: playground
        run: npm run build
      - name: Install browser
        working-directory: playground
        run: npx playwright install --with-deps chromium
      - name: Test playground in Chromium with real Pyodide
        working-directory: playground
        run: npm test
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy playground to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
